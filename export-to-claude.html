<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Sheet Data to Claude</title>
  <style>
    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F172A;
      color: #F7FAFC;
      padding: 40px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #00E6C3;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #CBD5E1;
      margin-bottom: 30px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      background: #3182CE;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover {
      background: #2563EB;
    }
    button.copy-btn {
      background: #00E6C3;
      color: #0F172A;
    }
    button.copy-btn:hover {
      background: #00D4B0;
    }
    .status {
      padding: 12px 16px;
      background: #1E293B;
      border-left: 3px solid #3182CE;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 14px;
    }
    .status.success {
      border-left-color: #00E6C3;
      color: #00E6C3;
    }
    .status.error {
      border-left-color: #FF7A61;
      color: #FF7A61;
    }
    .status.loading {
      border-left-color: #F0C040;
      color: #F0C040;
    }
    textarea {
      width: 100%;
      height: 500px;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #F7FAFC;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      resize: vertical;
    }
    .info {
      background: #141C26;
      border: 1px solid #2A3A4A;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #CBD5E1;
    }
    .info strong {
      color: #00E6C3;
    }
  </style>
</head>
<body>

<h1>📋 Trip Planner Data Export</h1>
<p class="subtitle">Export all sheet data in a format you can paste into Claude</p>

<div class="info">
  <strong>How to use:</strong>
  <ol>
    <li>Click "Fetch All Sheets" to pull data from your Google Sheet</li>
    <li>Click "Copy to Clipboard" to copy the formatted data</li>
    <li>Paste it directly into Claude chat</li>
  </ol>
</div>

<div class="controls">
  <button onclick="fetchAllSheets()">🔄 Fetch All Sheets</button>
  <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
  <button onclick="downloadAsFile()">⬇️ Download as .txt</button>
</div>

<div id="status"></div>

<textarea id="output" placeholder="Sheet data will appear here..."></textarea>

<script>
const SHEET_ID = '1rfTvbs8S5sdeAcVjihK9jcLn-YXezamPiOVzQy15dvk';
const API_KEY = 'AIzaSyCVPD9x65DJnjckSDbVEKSQXAEXO9kVzLI';
const BASE = 'https://sheets.googleapis.com/v4/spreadsheets';

function setStatus(message, type = 'info') {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = message;
}

async function fetchAllSheets() {
  setStatus('⏳ Fetching sheet metadata...', 'loading');
  
  try {
    // Get all sheet names
    const metaRes = await fetch(`${BASE}/${SHEET_ID}?key=${API_KEY}`);
    const metaData = await metaRes.json();
    
    if (metaData.error) {
      throw new Error(metaData.error.message);
    }
    
    const sheets = metaData.sheets || [];
    let output = `# Trip Planner Data Export\nGenerated: ${new Date().toLocaleString()}\n\n`;
    
    for (const sheet of sheets) {
      const sheetName = sheet.properties.title;
      setStatus(`⏳ Fetching "${sheetName}"...`, 'loading');
      
      const dataRes = await fetch(
        `${BASE}/${SHEET_ID}/values/${encodeURIComponent(sheetName + '!A:Z')}?key=${API_KEY}`
      );
      const data = await dataRes.json();
      
      const values = data.values || [];
      
      output += `\n${'='.repeat(60)}\n`;
      output += `SHEET: ${sheetName}\n`;
      output += `${'='.repeat(60)}\n\n`;
      
      if (values.length === 0) {
        output += '(empty sheet)\n';
      } else {
        // Try to parse as JSON if first cell looks like JSON
        if (values[0] && values[0][0] && values[0][0].startsWith('{')) {
          try {
            const parsed = JSON.parse(values[0][0]);
            output += JSON.stringify(parsed, null, 2) + '\n';
          } catch (e) {
            // Not JSON, output as-is
            output += formatAsTable(values);
          }
        } else {
          // Output as table
          output += formatAsTable(values);
        }
      }
    }
    
    document.getElementById('output').value = output;
    setStatus(`✅ Successfully fetched ${sheets.length} sheets!`, 'success');
    
  } catch (error) {
    setStatus(`❌ Error: ${error.message}`, 'error');
    console.error(error);
  }
}

function formatAsTable(values) {
  // Simple table format
  return values.map(row => 
    (row || []).map(cell => String(cell || '')).join(' | ')
  ).join('\n') + '\n';
}

function copyToClipboard() {
  const textarea = document.getElementById('output');
  if (!textarea.value) {
    setStatus('❌ No data to copy. Fetch sheets first!', 'error');
    return;
  }
  
  textarea.select();
  document.execCommand('copy');
  setStatus('✅ Copied to clipboard!', 'success');
  setTimeout(() => setStatus(''), 3000);
}

function downloadAsFile() {
  const textarea = document.getElementById('output');
  if (!textarea.value) {
    setStatus('❌ No data to download. Fetch sheets first!', 'error');
    return;
  }
  
  const blob = new Blob([textarea.value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trip-planner-data-${new Date().toISOString().split('T')[0]}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  setStatus('✅ File downloaded!', 'success');
}
</script>

</body>
</html>
